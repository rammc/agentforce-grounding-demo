# Data Lake Object (DLO) – AeroLift_Document_Chunk__dll
#
# Deklarative Spezifikation, die das Ziel-DLO in Data Cloud beschreibt.
# Source-of-Truth für Schema-Upload via `sf data360 connection schema-upsert`
# (siehe DEPLOY.md Schritt 4) bzw. UI-Anlage.
#
# Wichtige Constraints (aus sf-datacloud-Skill belegt):
#   - DLO-Feldnamen: keine zwei aufeinanderfolgenden Underscores; daher
#     KEIN `__c`-Suffix wie bei klassischen Custom-Feldern.
#   - DLO-Felder kennen nur drei primitive Datentypen: Text, Number, DateTime.
#     Picklists, LongTextArea, Boolean, Currency etc. existieren NICHT auf
#     DLO-Ebene.  Picklist-artige Felder werden als Text mit dokumentiertem
#     Wertebereich modelliert; Booleans als Text "true"/"false" (so liegen
#     sie auch in der CSV).

apiName: AeroLift_Document_Chunk__dll
label: AeroLift Document Chunk
# Category-Mapping aus sf-datacloud-prepare Skill:
#   Profile     – person/entity records
#   Engagement  – time-based events; verlangt zusätzlich ein Event-Time-Feld
#   Other       – reference / supporting datasets (= unser Fall)
category: Other
description: |
  Atomar zerlegte Markdown-Chunks (Tabellenzeilen + Prose-Sektionen) aus dem
  AeroLift-Pumpenkatalog. Source-of-Truth für die Custom-Vector-Search-Variante
  der Grounding-Demo.

primaryKey: recordId

ingestion:
  source: "Ingestion API / CSV-Upload (data-cloud/csv/all-records.csv)"
  encoding: "UTF-8 with BOM"
  multiValueDelimiter: ";"   # für productIds

fields:

  - name: recordId
    label: Record ID
    dataType: Text
    isPrimaryKey: true
    description: "Deterministische ID: <sourceFile>::<sectionSlug>::<row|chunk>-<idx>"

  - name: sourceFile
    label: Source File
    dataType: Text

  - name: sourceSection
    label: Source Section
    dataType: Text

  - name: chunkType
    label: Chunk Type
    dataType: Text
    description: "Erlaubte Werte: 'table-row' | 'prose' (Konvention, nicht im Schema erzwungen)."

  - name: content
    label: Chunk Content
    dataType: Text
    description: "Embedding-Quelle für den Search Index. Bei table-row in 'Spalte: Wert | …'-Form."

  - name: productIds
    label: Product IDs
    dataType: Text
    description: "Semikolon-separierte Liste der im Chunk erwähnten Modell-IDs (z.B. 'AL-3000-SX;AL-3500-HT-X')."

  - name: docType
    label: Document Type
    dataType: Text
    description: "Erlaubte Werte: catalog | spec-sheet | maintenance | compatibility | atex | changelog | faq."

  - name: atexZone
    label: ATEX Zone
    dataType: Text
    description: "Erlaubte Werte: '0' | '1' | '2' | '' (kein Ex)."

  - name: tempMaxC
    label: Max. Medientemperatur (°C)
    dataType: Number

  - name: foerderleistungM3h
    label: Förderleistung (m³/h)
    dataType: Number

  - name: werkstoffGehaeuse
    label: Werkstoff Gehäuse
    dataType: Text

  - name: ex_certified
    label: Ex-zertifiziert
    dataType: Text
    description: "'true' | 'false' – DLO kennt keinen nativen Boolean-Typ."

  - name: wirkungsgradPct
    label: Wirkungsgrad (%)
    dataType: Number

  - name: druckMaxBar
    label: Max. Druck (bar)
    dataType: Number

  - name: antriebsleistungKW
    label: Antriebsleistung (kW)
    dataType: Number
